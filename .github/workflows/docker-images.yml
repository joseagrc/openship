name: Docker images

# Publishes the pull-based self-hosted images to GHCR:
#   ghcr.io/<owner>/openship-api
#   ghcr.io/<owner>/openship-dashboard
#   ghcr.io/<owner>/openship-edge
#
# Recommended repository secrets:
#   GHCR_USERNAME=joseagrc
#   GHCR_TOKEN=<PAT with write:packages>
#
# If GHCR_TOKEN is absent, the workflow falls back to github.token. That works
# only when the repository's Actions token is allowed to write the target GHCR
# packages. Forks often need the explicit PAT secret.
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag for a manual test. Blank uses the short SHA. Never moves :latest."
        required: false
        type: string

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
  GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}

jobs:
  build-images:
    name: Build and publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - api
          - dashboard
          - edge
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Normalize image namespace
        run: echo "IMAGE_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Explain GHCR credentials
        env:
          HAS_GHCR_TOKEN: ${{ secrets.GHCR_TOKEN != '' }}
        run: |
          if [ "$HAS_GHCR_TOKEN" != "true" ]; then
            echo "::warning::GHCR_TOKEN is not configured. Falling back to github.token; if GHCR push is denied, add GHCR_USERNAME and GHCR_TOKEN repository secrets."
          else
            echo "Using GHCR_TOKEN repository secret for GHCR publishing."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/openship-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,format=short,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag == '' }}
          flavor: |
            latest=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'auto' || 'false' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Inspect published image
        run: docker buildx imagetools inspect "${{ env.IMAGE_NAMESPACE }}/openship-${{ matrix.image }}:${{ steps.meta.outputs.version }}"
