name: Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag for a manual test. Blank uses the short SHA."
        required: false
        type: string
      platforms:
        description: "Comma-separated Docker platforms. Default targets the current amd64 server."
        required: false
        default: "linux/amd64"
        type: string

env:
  REGISTRY: gitea.joseagrc.com
  IMAGE_OWNER: solutema
  DEFAULT_PLATFORMS: linux/amd64

jobs:
  build-images:
    name: Build and publish openship-${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - api
          - dashboard
          - edge

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_OWNER}/openship-${{ matrix.image }}"
          short_sha="$(git rev-parse --short HEAD)"

          tags=()
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            major="${version%%.*}"
            minor="${version%.*}"
            tags+=("${image}:${version}" "${image}:${minor}" "${image}:${major}" "${image}:latest")
          elif [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            tags+=("${image}:${{ inputs.tag }}")
          else
            tags+=("${image}:main" "${image}:main-${short_sha}")
          fi

          {
            echo "image=${image}"
            echo "inspect_tag=${tags[0]}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set build platforms
        id: platforms
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.platforms }}"
          if [[ -z "${requested}" ]]; then
            requested="${DEFAULT_PLATFORMS}"
          fi
          echo "value=${requested}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: contains(steps.platforms.outputs.value, 'arm')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Inspect published image
        run: docker buildx imagetools inspect "${{ steps.tags.outputs.inspect_tag }}" || true
